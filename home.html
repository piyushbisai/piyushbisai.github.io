<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1{
        text-align: center;
        background: greenyellow;
        text-shadow: 3px 3px 3px red;

    }
    button {
        background-color: brown;
        color:azure;
        padding: 12px 30px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
    }
    body{
        background-color: greenyellow;
        background-image:-moz-linear-gradient();
        background-image: url("lpuuuu.jpeg");
        background-size: cover;
        background-repeat: no-repeat;
        font-family: Arial, Helvetica, sans-serif;

    }
    password{
        background-color: brown;
    }
    
    
    
</style>
<body>
    <h1>Login</h1>
    <hr>
    <lebel for="name"><h4>Full Name:</h4></lebel>
    <input type="text" id="name" placeholder="Enter Your name.">
    <lebel for="registration number"><h4>Registration Number:</h4></lebel>
    <input type="tel" id="registration number" placeholder="Enter your Registration number.">
    <lebel for="contact"><h4>Contact Number:</h4></lebel>
    <input type="tel" id="contact" placeholder="Enter your number.">
    <lebel for="email"><h4>Email Id:</h4></lebel>
    <input type="email" id="email" placeholder="Enter your email." required>
    <lebel for="password"><h4> Password:</h4></lebel>
    <input type="password" id="password" placeholder="Create a password." minlength="8" required>
    <lebel for="year"><h4>Current Year:</h4></lebel>
    <input type="tel" id="year" placeholder="Select the year.">
    <br><br>
    <button type="submit">Submit</button>
    
 

    
</body>
</html>
